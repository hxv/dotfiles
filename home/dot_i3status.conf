general {
    output_format = "i3bar"
    colors = true
    color_good = "#DDDDDD"
    color_degraded = "#AE8ABE"
    color_bad = "#FF6B68"
    interval = 5
    separator = "   "
}

order += "path_exists timew"
order += "path_exists codestats"
order += "wireless _first_"
order += "cpu_usage"
order += "disk /"
order += "load"
order += "path_exists temperature"
order += "volume master"
order += "path_exists brightness"
order += "battery all"
order += "tztime local"

path_exists timew {
    path = /tmp
    format = "placeholder_timew"
}

path_exists codestats {
    path = /tmp
    format = "placeholder_codestats"
}

path_exists temperature {
    path = /tmp
    format = "placeholder_temperature"
}

path_exists brightness {
    path = /tmp
    format = "placeholder_brightness"
}

tztime local {
    format = " %Y-%m-%d %H:%M"
}

load {
    format = " %1min, %5min, %15min"
}

disk / {
    format = " %free"
    prefix_type = "custom"
}

wireless _first_ {
    format_up = " %essid"
    format_down = " "
}

cpu_usage {
    format = " %usage"
}

battery all {
    integer_battery_capacity = true
    format = " %percentage"
}

volume master {
    format = " %volume"
    device = "default"
    mixer = "Master"
}
